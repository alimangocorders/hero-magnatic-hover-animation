<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="cursor"></div>

    <div id="trail-layer"></div>

    <div class="wrapper">
      <h1 id="hero-title">
        <span class="word">Creative</span>
        <span class="word">Developer</span>
        <span class="word">Designer</span>
      </h1>
    </div>

    <script>
      const lerp = (a, b, n) => (1 - n) * a + n * b;
      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
      const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);

      // Shared mouse state
      let mouseX = -9999;
      let mouseY = -9999;

      document.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      // ---------------- 1. Custom Stretchy Cursor ----------------
      const cursor = document.querySelector(".cursor");
      let cx = mouseX, cy = mouseY, lastx = mouseX, lasty = mouseY;

      function animateCursor() {
        cx = lerp(cx, mouseX, 0.1);
        cy = lerp(cy, mouseY, 0.1);

        const vx = mouseX - lastx;
        const vy = mouseY - lasty;
        lastx = mouseX;
        lasty = mouseY;

        const speed = clamp(Math.hypot(vx, vy), 0, 40);
        const stretch = 1 + speed / 60;
        const angle = Math.atan2(vy, vx) * (180 / Math.PI);

        cursor.style.transform = `translate3d(${cx}px, ${cy}px, 0) rotate(${angle}deg) scaleX(${stretch}) scaleY(${1 / (stretch * 0.4 + 0.6)})`;

        requestAnimationFrame(animateCursor);
      }
      animateCursor();

      // ---------------- 2. Magnetic Text Distortion ----------------
      const title = document.getElementById("hero-title");
      let isHoveringText = false;

      // Track text hover state for image trail hiding
      title.addEventListener("mouseenter", () => (isHoveringText = true));
      title.addEventListener("mouseleave", () => (isHoveringText = false));

      // Split text into individual character spans
      title.querySelectorAll(".word").forEach((word) => {
        const text = word.textContent;
        word.textContent = "";
        [...text].forEach((ch) => {
          const span = document.createElement("span");
          span.className = "ch";
          span.textContent = ch;
          word.appendChild(span);
        });
      });

      const chars = [...title.querySelectorAll(".ch")];
      const state = chars.map(() => ({ x: 0, y: 0, tx: 0, ty: 0 }));
      let rects = [];

      function measure() {
        rects = chars.map((el) => {
          const r = el.getBoundingClientRect();
          return { cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
        });
      }

      window.addEventListener("load", measure);
      window.addEventListener("resize", measure);

      const RADIUS = 240;
      const STRENGTH = 34;

      function animateText() {
        for (let i = 0; i < chars.length; i++) {
          const r = rects[i];
          if (!r) continue;

          const d = dist(mouseX, mouseY, r.cx, r.cy);

          if (d < RADIUS) {
            const falloff = 1 - d / RADIUS;
            const angle = Math.atan2(r.cy - mouseY, r.cx - mouseX);
            state[i].tx = Math.cos(angle) * falloff * STRENGTH;
            state[i].ty = Math.sin(angle) * falloff * STRENGTH;
          } else {
            state[i].tx = 0;
            state[i].ty = 0;
          }

          state[i].x = lerp(state[i].x, state[i].tx, 0.14);
          state[i].y = lerp(state[i].y, state[i].ty, 0.14);
          chars[i].style.transform = `translate3d(${state[i].x}px, ${state[i].y}px, 0)`;
        }

        requestAnimationFrame(animateText);
      }
      animateText();

      // ---------------- 3. Image Trail Effect ----------------
      const layer = document.getElementById("trail-layer");
      const images = [
        "https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=500&auto=format&fit=crop&q=60",
        "https://images.unsplash.com/photo-1507187632231-5beb21a654a2?w=500&auto=format&fit=crop&q=60",
        "https://images.unsplash.com/photo-1477346611705-65d1883cee1e?w=500&auto=format&fit=crop&q=60",
        "https://images.unsplash.com/photo-1608764129330-5fa692919f7a?w=500&auto=format&fit=crop&q=60",
      ];

      const POOL_SIZE = 8;
      const pool = [];
      for (let i = 0; i < POOL_SIZE; i++) {
        const el = document.createElement("div");
        el.className = "trail-item";
        const img = document.createElement("img");
        img.src = images[i % images.length];
        el.appendChild(img);
        layer.appendChild(el);
        pool.push(el);
      }

      let poolIndex = 0;
      let lastX = null;
      let lastY = null;

      window.addEventListener("mousemove", (e) => {
        // Stop trailing images if user is hovering over title text
        if (isHoveringText) return;

        if (lastX === null) {
          lastX = e.clientX;
          lastY = e.clientY;
        }

        if (dist(e.clientX, e.clientY, lastX, lastY) < 60) return;
        lastX = e.clientX;
        lastY = e.clientY;

        const el = pool[poolIndex % POOL_SIZE];
        poolIndex++;
        const rot = (Math.random() * 16 - 8).toFixed(1);

        el.classList.remove("show");
        el.style.transition = "none";
        el.style.transform = `translate3d(${e.clientX - 75}px, ${e.clientY - 75}px, 0) scale(0.6) rotate(${rot}deg)`;

        // Force browser reflow
        void el.offsetWidth;

        el.style.transition = "";
        requestAnimationFrame(() => {
          el.classList.add("show");
          el.style.transform = `translate3d(${e.clientX - 75}px, ${e.clientY - 75}px, 0) scale(1) rotate(${rot}deg)`;
        });

        clearTimeout(el._hideTimer);
        el._hideTimer = setTimeout(() => {
          el.classList.remove("show");
          el.style.transform += " scale(0.8)";
        }, 820);
      });
    </script>
  </body>
</html>
